{% extends "layout.html" %}
{% block content %}

{% csrf_token %}

<div class="row g-4">
  <div class="col-md-7">
    <div id="detalle-producto" class="card shadow-sm border-0">
      <div class="card-body text-muted">Cargando producto...</div>
    </div>
  </div>

  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h5>Tu carrito</h5>
        <div id="carrito-contenido" class="text-muted">Cargando carrito...</div>
        <div id="carrito-mensaje" class="mt-2"></div>
      </div>
    </div>
  </div>
</div>

<a href="{% url 'tienda:catalogo' %}" class="btn btn-secondary mt-4">&larr; Volver al catálogo</a>

<script>
const PRODUCTO_ID = {{ producto_id }};

function getCookie(name) {
  const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return match ? decodeURIComponent(match[2]) : null;
}
const CSRF_TOKEN = getCookie('csrftoken');

function money(valor) {
  return 'S/ ' + Number(valor).toFixed(2);
}

async function cargarProducto() {
  const resp = await fetch(`/api/productos/${PRODUCTO_ID}/`);
  const data = await resp.json();
  const cont = document.getElementById('detalle-producto');

  if (!resp.ok) {
    cont.innerHTML = `<div class="card-body text-danger">${data.error}</div>`;
    return;
  }

  cont.innerHTML = `
    <img src="${data.imagen || 'https://via.placeholder.com/500x350?text=Figura'}" class="card-img-top" style="max-height:350px;object-fit:cover;">
    <div class="card-body">
      <span class="badge bg-secondary mb-2">${data.categoria.nombre}</span>
      <h3>${data.nombre}</h3>
      <p class="text-muted">${data.descripcion}</p>
      <p class="fs-4 text-primary fw-bold">${money(data.precio)}</p>
      <p class="small text-muted">Stock disponible: ${data.stock}</p>
      <div class="d-flex align-items-center gap-2 mb-2">
        <input type="number" id="cantidad" class="form-control" value="1" min="1" style="width: 80px;">
        <button class="btn btn-success" onclick="agregarAlCarrito()">Agregar al carrito</button>
      </div>
    </div>
  `;
}

async function cargarCarrito() {
  const resp = await fetch('/api/carrito/');
  const data = await resp.json();
  const cont = document.getElementById('carrito-contenido');

  if (!data.items || data.items.length === 0) {
    cont.innerHTML = '<p class="text-muted">Tu carrito está vacío.</p>';
    return;
  }

  const filas = data.items.map(item => `
    <li class="d-flex justify-content-between">
      <span>${item.cantidad} x ${item.producto.nombre}</span>
      <span>${money(item.subtotal)}</span>
    </li>
  `).join('');

  cont.innerHTML = `
    <ul class="list-unstyled">${filas}</ul>
    <hr>
    <p class="fw-bold">Total: ${money(data.total)}</p>
    <button class="btn btn-primary w-100" onclick="confirmarCompra()">Confirmar compra</button>
  `;
}

async function agregarAlCarrito() {
  const cantidad = parseInt(document.getElementById('cantidad').value, 10);
  const resp = await fetch('/api/carrito/agregar/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': CSRF_TOKEN,
    },
    body: JSON.stringify({ producto_id: PRODUCTO_ID, cantidad }),
  });
  if (resp.ok) {
    cargarCarrito();
  } else {
    const data = await resp.json();
    alert(JSON.stringify(data));
  }
}

async function confirmarCompra() {
  const resp = await fetch('/api/carrito/confirmar/', {
    method: 'POST',
    headers: { 'X-CSRFToken': CSRF_TOKEN },
  });
  const data = await resp.json();
  const msg = document.getElementById('carrito-mensaje');

  if (resp.ok) {
    msg.innerHTML = '<div class="alert alert-success">¡Compra confirmada!</div>';
    cargarCarrito();
    cargarProducto(); // el stock ya bajó, se refresca en pantalla
  } else {
    msg.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
  }
}

cargarProducto();
cargarCarrito();
</script>

{% endblock %}
